name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 1b. Setup .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 2. Build and run unit tests
      - name: Restore dependencies
        run: dotnet restore UserApi.Tests/UserApi.Tests.csproj

      - name: Build
        run: dotnet build UserApi.Tests/UserApi.Tests.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test UserApi.Tests/UserApi.Tests.csproj --no-build --configuration Release --verbosity normal

      # 3. Package Docker container image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Authenticate to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4b. Build and push version-tagged image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./UserApi/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/user-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/user-api:latest

      # 5. SSH into the VPS and redeploy
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/app
            docker compose pull
            docker compose up -d
