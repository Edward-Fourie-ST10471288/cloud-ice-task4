services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

  user-api:
    image: YOUR_DOCKERHUB_USERNAME/user-api:latest
    container_name: user-api
    ports:
      - "80:80"
    depends_on:
      - azurite
